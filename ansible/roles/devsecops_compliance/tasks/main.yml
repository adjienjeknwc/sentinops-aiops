---
# tasks file for devsecops_compliance
- name: Audit open listening network ports
  ansible.builtin.shell: |
    ss -tulwn
  register: open_ports

- name: Enforce strict file permissions on sensitive credentials
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { path: '/etc/shadow', mode: '0600' }
    - { path: '/etc/gshadow', mode: '0600' }
    - { path: '/etc/passwd', mode: '0644' }
    - { path: '/etc/group', mode: '0644' }
  ignore_errors: yes

- name: Run automated Trivy vulnerability scan on running containers
  ansible.builtin.command:
    cmd: "trivy image --severity HIGH,CRITICAL sentinops-app:latest"
  register: trivy_res
  ignore_errors: yes
